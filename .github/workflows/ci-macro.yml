name: CI - SWC Macro Plugin

on:
  pull_request:
    branches:
      - main
      - next
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  push:
    branches:
      - main
      - next
    paths-ignore:
      - "**/*.md"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rust formatting, clippy and unit tests run workspace-wide in ci-rust.yml.
  e2e-test:
    name: E2E Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Toolchain and the wasm32-wasip1 target come from rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v2

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run E2E test
        working-directory: ./packages/lingui-macro
        run: yarn test:e2e
