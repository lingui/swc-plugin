name: Release

on:
  release:
    types: [ released, prereleased ]

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      # Toolchain and the wasm32-wasip1 target come from rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          registry-url: 'https://registry.npmjs.org'
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install npm CLI
        # Trusted publishing needs npm >= 11.5.1.
        run: npm install -g npm@latest

      - name: Build and publish 'latest' tag
        working-directory: packages/lingui-macro
        if: ${{ github.event.action == 'released' }}
        run: npm publish

      - name: Build and publish 'next' tag
        working-directory: packages/lingui-macro
        if: ${{ github.event.action == 'prereleased' }}
        run: npm publish --tag next
