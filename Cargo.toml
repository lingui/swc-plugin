[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "6.7.0"
edition = "2021"

[profile.release]
codegen-units = 1
lto = false
opt-level = 3

[workspace.dependencies]
swc_core = { version = "77.1.1", default-features = false }
insta = { version = "1.48.0", features = ["serde"] }
